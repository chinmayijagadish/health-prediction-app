<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Patient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Add Patient</h3>
        </div>

        <div class="card-body">

            <form method="POST" id="patientForm">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input
                        type="text"
                        class="form-control"
                        name="name"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input
                        type="date"
                        class="form-control"
                        id="dob"
                        name="dob"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        required>

                    <small id="emailMessage"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Glucose</label>
                    <input
                        type="number"
                        class="form-control"
                        step="0.01"
                        min="0"
                        name="glucose"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Haemoglobin</label>
                    <input
                        type="number"
                        class="form-control"
                        step="0.01"
                        min="0"
                        name="haemoglobin"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cholesterol</label>
                    <input
                        type="number"
                        class="form-control"
                        step="0.01"
                        min="0"
                        name="cholesterol"
                        required>
                </div>

                <button
                    type="submit"
                    class="btn btn-success">
                    Save Patient
                </button>

            </form>

        </div>

    </div>

</div>

<script>

document.getElementById("dob").max =
new Date().toISOString().split("T")[0];


const emailField =
document.getElementById("email");

const emailMessage =
document.getElementById("emailMessage");

emailField.addEventListener("blur", function(){

    const pattern =
    /^[^@]+@[^@]+\.[^@]+$/;

    if(pattern.test(emailField.value)){

        emailMessage.innerHTML =
        "✓ Valid Email";

        emailMessage.style.color =
        "green";

    }

    else{

        emailMessage.innerHTML =
        "✗ Invalid Email";

        emailMessage.style.color =
        "red";

    }

});

</script>

</body>
</html>

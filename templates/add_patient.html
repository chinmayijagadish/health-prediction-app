<!DOCTYPE html>
<html>
<head>
    <title>Add Patient</title>
</head>
<body>

<h1>Add Patient</h1>

<form method="POST">

    <label>Full Name</label><br>
    <input type="text" name="name"><br><br>

    <label>Date of Birth</label><br>
    <input type="date" name="dob"><br><br>

    <label>Email</label><br>
    <input type="email" name="email"><br><br>

    <label>Glucose</label><br>
    <input type="number" step="0.01" name="glucose"><br><br>

    <label>Haemoglobin</label><br>
    <input type="number" step="0.01" name="haemoglobin"><br><br>

    <label>Cholesterol</label><br>
    <input type="number" step="0.01" name="cholesterol"><br><br>

    <button type="submit">
        Save Patient
    </button>

</form>

</body>
</html>

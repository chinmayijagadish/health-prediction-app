<!DOCTYPE html>
<html>

<head>

    <title>Edit Patient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>
                ✏️ Edit Patient
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>Full Name</label>

                    <input
                        type="text"
                        class="form-control"
                        name="name"
                        value="{{ patient[1] }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Date Of Birth</label>

                    <input
                        type="date"
                        class="form-control"
                        name="dob"
                        value="{{ patient[2] }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Email</label>

                    <input
                        type="email"
                        class="form-control"
                        name="email"
                        value="{{ patient[3] }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Glucose</label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        name="glucose"
                        value="{{ patient[4] }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Haemoglobin</label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        name="haemoglobin"
                        value="{{ patient[5] }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Cholesterol</label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        name="cholesterol"
                        value="{{ patient[6] }}"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-warning">

                    ✏️ Update Patient

                </button>

                <a href="/patients"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>

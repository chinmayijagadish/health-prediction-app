<!DOCTYPE html>
<html>

<head>

    <title>Patients</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">
        Patient Records
    </h2>

    <table class="table table-bordered table-striped">

        <thead class="table-primary">

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Glucose</th>
            <th>Haemoglobin</th>
            <th>Cholesterol</th>
            <th>Remarks</th>

        </tr>

        </thead>

        <tbody>

        {% for patient in patients %}

        <tr>

            <td>{{ patient[0] }}</td>
            <td>{{ patient[1] }}</td>
            <td>{{ patient[3] }}</td>
            <td>{{ patient[4] }}</td>
            <td>{{ patient[5] }}</td>
            <td>{{ patient[6] }}</td>
            <td>{{ patient[7] }}</td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
